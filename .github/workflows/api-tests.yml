name: API Tests (Postman/Newman)

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 */6 * * *'   # also runs every 6 hours
  workflow_dispatch:          # allows manual trigger

jobs:
  test:
    name: Run Newman API Tests
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 3. Install Newman + HTML reporter
      - name: Install Newman
        run: |
          npm install -g newman
          npm install -g newman-reporter-htmlextra
      
      # ADD THIS STEP before running Newman
      - name: Create reports directory
        run: mkdir -p reports


      # 4. Run Postman collection
      - name: Run API Tests
        id: newman
        run: |
          newman run postman/collection.json \
            --environment postman/environment.json \
            --env-var "baseUrl=${{ secrets.BASEURL }}" \
            --env-var "API_KEY=${{ secrets.API_KEY }}" \
            --reporters cli,htmlextra \
            --reporter-htmlextra-export reports/test-report.html \
            --reporter-htmlextra-title "Monetization API Test Report" \
            --reporter-htmlextra-browserTitle "API Tests" \
            --suppress-exit-code    # we'll handle failure ourselves below
        continue-on-error: true     # so we can still upload report on failure

      # 5. Upload HTML report as artifact
      - name: Upload Test Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-test-report
          path: reports/test-report.html
          retention-days: 30

      # 6. Fail the job if tests failed
      - name: Fail job if tests failed
        if: steps.newman.outcome == 'failure'
        run: exit 1
